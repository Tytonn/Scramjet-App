<!doctype html>
<html lang="en" class="boot" data-view="lock">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#050506" />
		<title>Student Portal</title>

		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon-32x32.png?v=2"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/favicon-16x16.png?v=2"
		/>
		<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

		<script>
			// Runs before first paint: skip the code screen if it was already
			// entered this session, and never leave the page invisible.
			try {
				if (sessionStorage.getItem("gate_ok") === "1")
					document.documentElement.dataset.view = "home";
				if (sessionStorage.getItem("lite") === "1")
					document.documentElement.classList.add("lite");
			} catch (e) {}
			setTimeout(function () {
				document.documentElement.classList.remove("boot");
			}, 1600);
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
			crossorigin
		/>
		<link rel="stylesheet" href="index.css" />

		<script src="/scram/scramjet.all.js" defer></script>
		<script src="/baremux/index.js" defer></script>
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body class="portal">
		<div class="ambient" id="ambient" aria-hidden="true">
			<div class="glow"></div>
			<div class="grain"></div>
		</div>

		<main class="stage" id="stage">
			<h1 class="title">
				<span class="title-lock">District code</span>
				<span class="title-home">Where to?</span>
			</h1>

			<div class="orbits" id="orbits" aria-hidden="true">
				<div class="orbit"><i></i></div>
				<div class="orbit"><i></i></div>
				<div class="orbit"><i></i></div>
			</div>

			<div class="pill" id="pill">
				<label class="lock" id="lock">
					<input
						id="code"
						type="text"
						inputmode="numeric"
						pattern="[0-9]*"
						maxlength="4"
						autocomplete="off"
						autocorrect="off"
						autocapitalize="off"
						spellcheck="false"
						enterkeyhint="done"
						aria-label="District code"
					/>
					<span class="dots" aria-hidden="true">
						<i style="--i: 0"></i><i style="--i: 1"></i><i style="--i: 2"></i
						><i style="--i: 3"></i>
					</span>
				</label>

				<form class="omni" id="sj-form" autocomplete="off" inert>
					<span class="omni-icon" aria-hidden="true">
						<svg class="icon-search" viewBox="0 0 24 24">
							<circle cx="11" cy="11" r="6.25" />
							<path d="m15.75 15.75 4 4" />
						</svg>
						<svg class="icon-globe" viewBox="0 0 24 24">
							<circle cx="12" cy="12" r="8.25" />
							<path d="M3.75 12h16.5" />
							<path
								d="M12 3.75c2.2 2.3 3.3 5.05 3.3 8.25s-1.1 5.95-3.3 8.25c-2.2-2.3-3.3-5.05-3.3-8.25S9.8 6.05 12 3.75Z"
							/>
						</svg>
					</span>
					<input
						id="sj-address"
						type="text"
						placeholder="Search or enter a link"
						autocomplete="off"
						autocorrect="off"
						autocapitalize="off"
						spellcheck="false"
						enterkeyhint="go"
						aria-label="Search or enter a link"
					/>
					<button class="go" id="go" type="submit" aria-label="Go">
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="M5 12h14" />
							<path d="m13 6 6 6-6 6" />
						</svg>
					</button>
					<input
						id="sj-search-engine"
						value="https://www.google.com/search?q=%s"
						type="hidden"
					/>
				</form>
			</div>

			<p class="hint" id="hint" role="status" aria-live="polite"></p>
		</main>

		<footer class="status" id="status" data-state="starting">
			<span class="status-dot"></span>
			<span class="status-text" id="status-text">Starting</span>
		</footer>
	</body>
</html>
